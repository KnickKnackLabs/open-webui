name: Container Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/knickknacklabs/open-webui

jobs:
  build:
    name: Build ${{ matrix.platform }} pull request image
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha,scope=open-webui-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=open-webui-${{ matrix.cache }}
          provenance: false

  publish-preflight:
    name: Refuse an existing commit tag
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse to replace an existing commit tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          versions="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/orgs/KnickKnackLabs/packages/container/open-webui/versions?per_page=100'
          )"
          if jq -e --arg tag "$IMAGE_TAG" \
            'any(.[]; any(.metadata.container.tags[]?; . == $tag))' \
            <<<"$versions" >/dev/null; then
            printf 'refusing to replace existing image tag: %s:%s\n' "$IMAGE" "$IMAGE_TAG" >&2
            exit 1
          fi

  publish-platform:
    name: Publish ${{ matrix.platform }} image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish-preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_HASH=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          cache-from: type=gha,scope=open-webui-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=open-webui-${{ matrix.cache }}
          provenance: false

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'unexpected platform digest: %s\n' "$DIGEST" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Preserve platform digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digest-${{ matrix.cache }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish multi-architecture manifest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore platform digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and verify immutable manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_REF="$IMAGE:$IMAGE_TAG"
          versions="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/orgs/KnickKnackLabs/packages/container/open-webui/versions?per_page=100'
          )"
          if jq -e --arg tag "$IMAGE_TAG" \
            'any(.[]; any(.metadata.container.tags[]?; . == $tag))' \
            <<<"$versions" >/dev/null; then
            printf 'refusing to replace existing image tag: %s\n' "$IMAGE_REF" >&2
            exit 1
          fi

          mapfile -t digests < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            printf 'expected two platform digests, got %s\n' "${#digests[@]}" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              printf 'unexpected platform digest filename: %s\n' "$digest" >&2
              exit 1
            fi
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create --tag "$IMAGE_REF" "${sources[@]}"

          manifest=/tmp/manifest.json
          docker buildx imagetools inspect "$IMAGE_REF" --raw > "$manifest"
          observed_platforms="$(
            jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' "$manifest" | sort
          )"
          expected_platforms="$(printf 'linux/amd64\nlinux/arm64')"
          if [ "$observed_platforms" != "$expected_platforms" ]; then
            printf 'unexpected manifest platforms:\n%s\n' "$observed_platforms" >&2
            exit 1
          fi

          digest="$(docker buildx imagetools inspect "$IMAGE_REF" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'could not determine manifest digest: %s\n' "$digest" >&2
            exit 1
          fi
          {
            printf '### Published multi-architecture image\n\n'
            printf "Platforms: \`linux/amd64\`, \`linux/arm64\`\n\n"
            printf "Source tag: \`%s\`\n\n" "$IMAGE_REF"
            printf "Deploy by digest: \`%s@%s\`\n" "$IMAGE" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
